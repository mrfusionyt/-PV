name: Build and Release

on:
  push:
    tags:
      - 'v*' # Запускать сборку при пуше тега, начинающегося с 'v'

permissions:
  contents: write # Разрешение на создание релизов

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Укажите вашу версию Python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name PhotoClassifier --icon=img/8080.png --add-data "img;img" main.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhotoClassifier.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}