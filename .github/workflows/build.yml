name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name PhotoClassifier --icon=img/8080.png --add-data "img;img" main.py

      - name: Compress to ZIP
        run: |
          Compress-Archive -Path dist\PhotoClassifier\* -DestinationPath dist\PhotoClassifier.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/PhotoClassifier.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}